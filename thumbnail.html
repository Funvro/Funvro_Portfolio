<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thumbnails - FVR Visuals</title>
<style>
body{
  background:#050816;
  color:white;
  font-family:Arial;
  padding:20px;
}
a{
  color:#60a5fa;
  text-decoration:none;
}
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:20px;
  margin-top:20px;
}
.item{
  background:#0b1220;
  border:1px solid #1a2a46;
  border-radius:22px;
  overflow:hidden;
}
.item img{
  width:100%;
  display:block;
}
.title{
  padding:14px;
  font-weight:bold;
}
</style>
</head>
<body>

<a href="index.html">← Back</a>

<h1>Thumbnail Works</h1>

<div class="grid">

  <div class="item">
    <img src="images/warden.jpg">
    <div class="title">Warden Cinematic</div>
  </div>

  <div class="item">
    <img src="images/hammer.jpg">
    <div class="title">Hammer Fight</div>
  </div>

  <div class="item">
    <img src="images/nether.jpg">
    <div class="title">Nether Battle</div>
  </div>

  <div class="item">
    <img src="images/live.jpg">
    <div class="title">Live Thumbnail</div>
  </div>

  <div class="item">
    <img src="images/galaxy.jpg">
    <div class="title">Galaxy Team</div>
  </div>

</div>

</body>
      </html>
